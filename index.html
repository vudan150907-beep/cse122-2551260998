<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài thơ Bốn mùa</title>

<style>
    :root{
        --blue: #0033CC;
        --red: #D40000;
        --yellow: #FFFDE7;
        --pink: #FFD9E6;
        --gray: #9E9E9E;
    }
    *{
        box-sizing: border-box;
    }
    body{
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:"Times new roman", serif;
    }
    article{
        width: 730px;
        max-width: 95%;
        padding: 24px;
        text-align: center;
        background-color: var(--yellow);
        border: 1px solid var(--gray);
    }
    h1{
        color: var(--red);
        background-color: var(--pink);
        font-size: 26px;
        margin: 0 0 20px;
        padding: 6px 0;
    }
   p {
            font-size: 18px;
            font-style: italic;
            line-height: 1.7;
            margin: 0;
        }

        .blue {
            color: var(--blue);
        }

        .red {
            color: var(--red);
        }

        hr {
            width: 55%;
            border: none;
            border-top: 2px solid #6688FF;
            margin: 18px auto;
        }
</style>
</head>
<body>
    <article>
        <h1>BỐN MÙA</h1>
        <p class="blue">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="red">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="blue">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>
</body>
</html>
